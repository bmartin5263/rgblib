; PlatformIO Project Configuration File
;
; Standalone example demonstrating rgblib's RainbowApplication.
; Builds against the library source directly via a relative include
; path (mirrors the -I layout in the repo root's platformio.ini),
; since rgblib's headers are referenced by bare filename across
; several subdirectories rather than through a single public path.
;
; https://docs.platformio.org/page/projectconf.html

[env:nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
lib_ldf_mode = chain+
lib_compat_mode = strict
build_flags =
  -std=gnu++2a
  -Wall
  -fno-exceptions
  -D RGB_ARDUINO
  -D RGB_ARDUINO_NANO
  -I"../../src/core"
  -I"../../src/core/debug"
  -I"../../src/core/event"
  -I"../../src/core/led"
  -I"../../src/core/network"
  -I"../../src/core/pixel"
  -I"../../src/core/priv"
  -I"../../src/core/sensor"
  -I"../../src/core/threading"
  -I"../../src/core/time"
  -I"../../src/effect"
  -I"../../src/main"
build_unflags =
  -std=gnu++11
  -fexceptions
lib_deps =
  symlink://../..
  ESP32Async/ESPAsyncWebServer
  ESP32Async/AsyncTCP
  olikraus/U8g2
  adafruit/Adafruit NeoPixel
  adafruit/RTClib
  adafruit/Adafruit BusIO
  z3t0/IRremote@4.4.2
  fastled/FastLED
  mh-tobi/MCP2515
