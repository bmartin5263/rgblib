; PlatformIO Project Configuration File
;
; Standalone example demonstrating rgblib's RainbowApplication.
; Builds against the library source directly via a relative include
; path (mirrors the -I layout in the repo root's platformio.ini),
; since rgblib's headers are referenced by bare filename across
; several subdirectories rather than through a single public path.
;
; https://docs.platformio.org/page/projectconf.html

[env:nano_esp32]
platform = espressif32@7.0.1
board = arduino_nano_esp32
framework = arduino
lib_ldf_mode = chain+
lib_compat_mode = strict
build_flags =
  -std=gnu++2a
  -Wall
  -fno-exceptions
  -fno-rtti
  -D RGB_ARDUINO_ESP32=1
  -D RGB_INPLACE_FUNCTION
  -I"$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src"
  -I"../../src/core"
  -I"../../src/core/animation"
  -I"../../src/core/debug"
  -I"../../src/core/event"
  -I"../../src/core/led"
  -I"../../src/core/network"
  -I"../../src/core/pixel"
  -I"../../src/core/priv"
  -I"../../src/core/sensor"
  -I"../../src/core/threading"
  -I"../../src/core/time"
  -I"../../src/effect"
  -I"../../src/main"
build_unflags =
  -std=gnu++11
  -fexceptions
lib_deps =
  symlink://../..
  ESP32Async/ESPAsyncWebServer@3.12.1
  ESP32Async/AsyncTCP@3.5.0
  olikraus/U8g2@2.36.18
  adafruit/Adafruit NeoPixel@1.15.5
  adafruit/RTClib@2.1.4
  adafruit/Adafruit BusIO@1.17.4
  z3t0/IRremote@4.4.2
  fastled/FastLED@3.10.3

; Runs the app on the host desktop with pixels rendered in an SDL2 window
; instead of physical LEDs. Requires SDL2 installed system-wide
; (e.g. `brew install sdl2` on macOS, `apt install libsdl2-dev` on Linux)
[env:native_app]
platform = native
lib_deps =
  symlink://../..
build_flags =
  -std=gnu++2a
  -D RGB_NATIVE=1
  -I"../../test/stubs"
  -I"../../src/core"
  -I"../../src/core/animation"
  -I"../../src/core/debug"
  -I"../../src/core/event"
  -I"../../src/core/led"
  -I"../../src/core/network"
  -I"../../src/core/pixel"
  -I"../../src/core/priv"
  -I"../../src/core/sensor"
  -I"../../src/core/threading"
  -I"../../src/core/time"
  -I"../../src/effect"
  -I"../../src/main"
  !pkg-config --cflags sdl2
  !pkg-config --libs sdl2
