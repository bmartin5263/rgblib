; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[hardware]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
lib_ldf_mode = chain+
lib_compat_mode = strict
build_flags =
  -std=gnu++2a
  -Wall
  -fno-exceptions
  -D RGB_ARDUINO
  -D RGB_ARDUINO_NANO
  -D RGB_VEHICLE_CORE_STACK_SIZE=8192
  -D RGB_VEHICLE_CORE_PRIORITY=1
  -I"src/car"
  -I"src/core"
  -I"src/core/animation"
  -I"src/core/debug"
  -I"src/core/event"
  -I"src/core/led"
  -I"src/core/network"
  -I"src/core/pixel"
  -I"src/core/priv"
  -I"src/core/sensor"
  -I"src/core/threading"
  -I"src/core/time"
  -I"src/effect"
  -I"src/main"
  -I"src/rgb"
build_unflags =
  -std=gnu++11
  -fexceptions
lib_deps=
  ESP32Async/ESPAsyncWebServer
  olikraus/U8g2
  adafruit/Adafruit NeoPixel
  adafruit/RTClib
  adafruit/Adafruit BusIO
  z3t0/IRremote@4.4.2
  fastled/FastLED
  mh-tobi/MCP2515

[env:verbose]
extends = hardware
build_flags =
  ${hardware.build_flags}
  -D RGB_DEBUG
  -D RGB_LOG_LEVEL=2

[env:debug]
extends = hardware
build_flags =
  ${hardware.build_flags}
  -D RGB_DEBUG
  '-D RGB_WIFI_SSID="Farplane"'
  !echo '-D RGB_WIFI_PASSWORD=\\"'$(echo $RGB_WIFI_PASSWORD)'\\"'
  -D RGB_OTA=1

[env:release]
extends = hardware
build_flags =
  ${hardware.build_flags}

[env:ci]
extends = hardware
build_flags =
  ${hardware.build_flags}

[env:debug_can]
extends = hardware
build_flags =
  ${hardware.build_flags}
  -D RGB_DEBUG
  -D RGB_VEHICLE_CORE_ENABLED=0

[env:debug_lincoln]
extends = hardware
build_flags =
  ${hardware.build_flags}
  -D RGB_DEBUG
  -D RGB_VEHICLE_RX=D9
  -D RGB_VEHICLE_TX=D10

[env:release_lincoln]
extends = hardware
build_flags =
  ${hardware.build_flags}
  -D RGB_VEHICLE_RX=D11
  -D RGB_VEHICLE_TX=D12
  -D RGB_SPI_SCK=A2
  -D RGB_SPI_MISO=A0
  -D RGB_SPI_MOSI=A1
  -D RGB_SPI_CS=A3

[env:native]
platform = native
test_framework = googletest
build_flags =
  -std=gnu++20
  -I"test/stubs"
  -I"src/core"
  -I"src/core/priv"